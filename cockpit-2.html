function stopCard(stop){ const drive=stop.type==='drive'; return '<div class="stop-card '+(drive?'drive':'')+'"><div class="stop-top"><span class="tag">'+esc(stop.tag||'行程')+'</span>'+(drive?'<span class="tag">转场信息</span>':'')+'</div><h4>'+esc(stop.title)+'</h4><p>'+esc(stop.desc)+'</p>'+(drive?'':' '+safeImage(stop.img,stop.title))+'<div class="meta-row"><span class="meta">'+esc(stop.lat)+', '+esc(stop.lng)+'</span><span class="meta">'+(drive?'地图/车费见路线卡':'识别卡')+'</span></div><a class="map-button" href="'+esc(stop.map)+'" target="_blank" rel="noopener">📍 Google Maps 查看位置 ↗</a></div>'; }
function render(){ const day=payload.days[active]; el('heroTitle').textContent=day.title; el('heroSub').textContent=day.date+' · '+day.badge+' · 每段路线、时间和导航入口都在同一页'; el('routeTitle').textContent=day.route; el('routeBadge').textContent=day.badge||''; el('routeMap').innerHTML=routeSvg(day); el('routeNote').textContent=day.mapNote||'先看路线示意图，再按时间轴执行。'; el('routeLink').href='https://www.google.com/maps/search/'+encodeURIComponent(day.route+' Thailand'); el('routeStats').innerHTML=stats(day); el('timelineTitle').textContent=day.label+' 时间轴 · '+day.title; el('timelineSub').textContent='地图先看顺序，时间轴再看每个点；转场段落不放景点图。'; let html=''; (day.stops||[]).forEach(stop=>{ html+='<article class="stop '+esc(stop.type||'')+'"><div class="time">'+esc(stop.time)+'</div><div class="dot"></div>'+stopCard(stop)+'</article>'; if(active==='D1' && stop.title.includes('晚餐')) html+=dinnerBlock(); }); html+='<div class="day-end">当天收口：按现场体力、天气、排队和 Grab 实时价格调整；不需要为了“打卡完整”硬赶下一个点。</div>'; el('timeline').innerHTML=html; el('dayTabs').innerHTML=dayKeys.map(k=>'<button class="pill day-tab '+(k===active?'active':'')+'" data-day="'+k+'">'+esc(payload.days[k].label)+'</button>').join(''); document.querySelectorAll('.day-tab').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.day;render();window.scrollTo({top:0,behavior:'smooth'})})); }
render();

<script>/* route map + dinner distance patch */
(function(){
  const compactPoint=function(coords,i,width,height){const lats=coords.map(x=>x[0]),lngs=coords.map(x=>x[1]);const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);return [100+(coords[i][1]-minLng)/Math.max(maxLng-minLng,.001)*(width-200),height-90-(coords[i][0]-minLat)/Math.max(maxLat-minLat,.001)*(height-180)];};
  const distanceLabel=function(day){const r=day.route||'';if(r.includes('素万那普'))return '约 28 公里 · Grab 工作版';if(r.includes('Chatuchak'))return '约 16 公里 · 市内多段移动';if(r.includes('大皇宫'))return '约 8 公里 · 老城 / 河岸';if(r.includes('Mytt Hotel Pattaya'))return '约 150 公里 · 曼谷 → 芭提雅';if(r.includes('Bali Hai Pier'))return '约 35 公里 · 码头 / 海岛往返';if(r.includes('Nong Nooch'))return '约 70 公里 · 芭提雅南线往返';if(r.includes('芭提雅北站'))return '约 140 公里 · 芭提雅 → 机场附近';if(r.includes('PP Garden Home'))return '约 5 公里 · 机场接驳';return '路线距离以 Google Maps 实时结果为准';};
  routeSvg=function(day){const coords=day.coords||[],width=1200,height=420;if(!coords.length)return '';const pts=coords.map((_,i)=>compactPoint(coords,i,width,height));const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const start=pts[0],end=pts[pts.length-1],mid=[(start[0]+end[0])/2,(start[1]+end[1])/2];const parts=(day.route||day.title||'').split('→').map(x=>x.trim()).filter(Boolean),startName=parts[0]||'起点',endName=parts[parts.length-1]||'终点';const endpoint=function(p,name,color,side){const w=220,h=38,x=side==='right'?Math.min(width-w-12,p[0]+24):Math.max(12,p[0]-w-24),y=Math.max(92,Math.min(height-h-12,p[1]-h/2));return '<g><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="20" fill="'+color+'" stroke="#fff" stroke-width="7"/><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="7" fill="#fff"/><rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w+'" height="'+h+'" rx="19" fill="#fff" stroke="'+color+'" stroke-width="2"/><text x="'+(x+14).toFixed(1)+'" y="'+(y+24).toFixed(1)+'" font-size="16" font-weight="900" fill="#172033">'+esc(name.slice(0,23))+'</text></g>';};const dw=230,dh=32,tag='<g><rect x="'+(mid[0]-dw/2).toFixed(1)+'" y="'+(mid[1]-dh-15).toFixed(1)+'" width="'+dw+'" height="'+dh+'" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="'+mid[0].toFixed(1)+'" y="'+(mid[1]-dh/2-15).toFixed(1)+'" text-anchor="middle" font-size="14" font-weight="900" fill="#9a3412">'+esc(distanceLabel(day))+'</text></g>';const arrow='<path d="M'+(mid[0]-12).toFixed(1)+' '+(mid[1]-7).toFixed(1)+' L'+(mid[0]+13).toFixed(1)+' '+mid[1].toFixed(1)+' L'+(mid[0]-12).toFixed(1)+' '+(mid[1]+7).toFixed(1)+' Z" fill="#e11d48" stroke="#fff" stroke-width="3"/>';return '<svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="'+esc(day.route)+' 路线示意图"><rect width="1200" height="420" fill="#e7f0f4"/><path d="M0 80H1200M0 210H1200M0 340H1200M180 0V420M430 0V420M720 0V420M990 0V420" stroke="#c6d7dd" stroke-width="3"/><path d="'+line+'" fill="none" stroke="#e11d48" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 13"/><text x="32" y="38" font-size="22" font-weight="800" fill="#27495a">路线示意图 · '+esc(day.badge||'当天主线')+'</text><text x="32" y="66" font-size="15" fill="#64748b">起点 → 终点 · 距离是工作版估算，精确定位请点下方 Google Maps</text>'+tag+arrow+endpoint(start,startName,'#2563eb','right')+endpoint(end,endName,'#7c3aed','left')+'</svg>';};
  dinnerSvg=function(){const hotel=[36,112],shops=[[190,46],[350,112],[190,178]],labels=['酒店内 · 0 米','约 300 米','约 570 米'],positions=[[112,76],[238,82],[112,154]],lines=shops.map((p,i)=>{const xy=positions[i],w=i===0?104:86;return '<path d="M'+hotel[0]+' '+hotel[1]+' L'+p[0]+' '+p[1]+'" stroke="#f97316" stroke-width="3" stroke-dasharray="7 7"/><g><rect x="'+(xy[0]-w/2).toFixed(1)+'" y="'+(xy[1]-13).toFixed(1)+'" width="'+w+'" height="26" rx="13" fill="#fff" stroke="#fb923c" stroke-width="1.5"/><text x="'+xy[0].toFixed(1)+'" y="'+(xy[1]+5).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="900" fill="#9a3412">'+labels[i]+'</text></g>';}).join(''),nodes='<circle cx="36" cy="112" r="14" fill="#7c3aed" stroke="#fff" stroke-width="6"/><text x="58" y="117" font-size="13" font-weight="900" fill="#172033">Samala Hotel · 起点</text>'+shops.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="13" fill="#ea580c" stroke="#fff" stroke-width="6"/><text x="'+(p[0]+20)+'" y="'+(p[1]+5)+'" font-size="13" font-weight="900" fill="#172033">'+(i+1)+'. '+esc(d1Dinner[i].name.slice(0,20))+'</text>').join('');return '<svg viewBox="0 0 620 224" role="img" aria-label="酒店与三家晚餐候选位置及距离关系图"><rect width="620" height="224" fill="#edf4f6"/><path d="M0 32H620M0 96H620M0 160H620M120 0V224M290 0V224M470 0V224" stroke="#d6e3e6" stroke-width="2"/>'+lines+nodes+'</svg>';};
  render();
})();
</script><script>/* route transport mode labels patch */
(function(){
  const transportLabel=function(day){const r=day.route||'';if(r.includes('素万那普'))return '打车/Grab · 约 28 公里';if(r.includes('Chatuchak'))return 'BTS/MRT+步行 · 约 16 公里';if(r.includes('大皇宫'))return '步行/打车 · 约 8 公里';if(r.includes('Mytt Hotel Pattaya'))return '跨城车 · 约 150 公里';if(r.includes('Bali Hai Pier'))return '打车/船 · 约 35 公里';if(r.includes('Nong Nooch'))return '打车/包车 · 约 70 公里';if(r.includes('芭提雅北站'))return '跨城车 · 约 140 公里';if(r.includes('PP Garden Home'))return '打车/Grab · 约 5 公里';return '交通方式与距离以 Google Maps 实时结果为准';};
  const previousRender=render;
  render=function(){previousRender();const label=transportLabel(payload.days[active]);const target=[...document.querySelectorAll('#routeMap svg text')].find(t=>/公里|实时结果/.test(t.textContent||''));if(target)target.textContent=label;const stat=document.querySelector('#routeStats .stat b');if(stat&&payload.days[active].title.includes('BKK 机场'))stat.textContent='打车/Grab · 约 28 km';};
  render();
})();
